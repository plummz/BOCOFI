<!DOCTYPE html>

      <p class="muted">Sign in to manage machines, rewards and users.</p>
      <div class="field"><label for="lUser">Username</label><input class="input" id="lUser" autocomplete="username" value="admin" required></div>
      <div class="field"><label for="lPass">Password</label><input class="input" id="lPass" type="password" autocomplete="current-password" value="admin123" required></div>
      <div class="error" id="loginErr"></div>
      <button class="btn btn-block" type="submit">Sign in</button>
      <p class="help center mt">Demo credentials are pre-filled. Change them in Settings.</p>
