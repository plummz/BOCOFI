<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BOCO-FI">
  <title>BOCO-FI · App</title>
  <link rel="icon" href="../assets/img/mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/img/mark.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="phone" id="app">
    <header class="a-header">
      <img src="../assets/img/logo.svg" alt="BOCO-FI" class="a-logo">
      <button class="a-avatar" id="hdrAvatar" data-view="profile" aria-label="Profile" hidden></button>
    </header>

    <main class="a-main" id="view"></main>

    <nav class="a-nav" id="nav" hidden>
      <button data-view="home"><svg class="ico" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
      <button data-view="link"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M21 14v7h-7"/></svg><span>Link</span></button>
      <button data-view="vouchers"><svg class="ico" viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg><span>Wi-Fi</span></button>
      <button data-view="history"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
      <button data-view="profile"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Profile</span></button>
    </nav>
  </div>
  <div class="toast-host" id="toasts"></div>

  <script src="../assets/js/db.js"></script>
  <script src="app.js"></script>
</body>
</html>
